  <style>

  <h2>Todo List</h2>

  <label>
    Task:
    <input type="text" id="taskInput">
  </label>

  <button onclick="addTask()">Add</button>

  <ul id="todoList">
    <li>
      <span onclick="toggleTask(this)">☐ Learn JavaScript</span>
      <button onclick="deleteTask(this)">Delete</button>
    </li>

    <li>
      <span class="completed" onclick="toggleTask(this)">
        ☑ Learn HTML
      </span>
      <button onclick="deleteTask(this)">Delete</button>
    </li>

    <li>
      <span onclick="toggleTask(this)">☐ Practice DOM</span>
      <button onclick="deleteTask(this)">Delete</button>
    </li>

    function addTask() {
      const input = document.getElementById("taskInput");

      document.getElementById("todoList").appendChild(li);

      input.value = "";

    function deleteTask(button) {
      button.parentElement.remove();

<!-- 20. Student Manager
Build a small application where the user can add students.
Form:
Name:  [___________]
Age:   [___________]
Course:[___________]
[Add Student]Display students as cards:
┌────────────────────┐
│ Aram                │
│ Age: 21             │
│ Course: JavaScript  │
│                     │
│ [Delete]            │
└────────────────────┘Requirements:
add studentsdelete studentsshow the total number of studentsprevent empty fieldsuse createElement()use append() / appendChild()use addEventListener()use 
classListuse DOM properties such as textContent and value -->
<!-- <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Manager</title>

  <style>
    .student-card {
      width: 220px;
      border: 1px solid black;
      border-radius: 8px;
      padding: 15px;
      margin-top: 10px;
    }

    .student-card h3 {
      margin: 0 0 10px;
    }

    .delete-btn {
      margin-top: 10px;
    }

    .error {
      color: red;
    }
  </style>
</head>
<body>

  <h1>Student Manager</h1>

  <label>
    Name:
    <input type="text" id="name">
  </label>

  <br><br>

  <label>
    Age:
    <input type="number" id="age">
  </label>

  <br><br>

  <label>
    Course:
    <input type="text" id="course">
  </label>

  <br><br>

  <button id="addBtn">Add Student</button>

  <p id="error" class="error"></p>

  <h2>
    Total Students:
    <span id="total">0</span>
  </h2>

  <div id="students"></div>

  <script>
    const nameInput = document.getElementById("name");
    const ageInput = document.getElementById("age");
    const courseInput = document.getElementById("course");

    const addBtn = document.getElementById("addBtn");
    const students = document.getElementById("students");
    const total = document.getElementById("total");
    const error = document.getElementById("error");

    let studentCount = 0;

    addBtn.addEventListener("click", function () {
      const name = nameInput.value.trim();
      const age = ageInput.value.trim();
      const course = courseInput.value.trim();

      if (name === "" || age === "" || course === "") {
        error.textContent = "Please fill in all fields.";
        return;
      }

      error.textContent = "";

      const card = document.createElement("div");
      card.classList.add("student-card");

      const studentName = document.createElement("h3");
      studentName.textContent = name;

      const studentAge = document.createElement("p");
      studentAge.textContent = `Age: ${age}`;

      const studentCourse = document.createElement("p");
      studentCourse.textContent = `Course: ${course}`;

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "Delete";
      deleteBtn.classList.add("delete-btn");

      deleteBtn.addEventListener("click", function () {
        card.remove();

        studentCount--;

        total.textContent = studentCount;
      });

      card.append(
        studentName,
        studentAge,
        studentCourse,
        deleteBtn
      );

      students.appendChild(card);

      studentCount++;

      total.textContent = studentCount;

      nameInput.value = "";
      ageInput.value = "";
      courseInput.value = "";
    });
  </script>

</body>
</html> -->
